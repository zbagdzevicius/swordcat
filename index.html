<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F6E7D2">
  <title>Swordcat: Nine Lives of Meow Island</title>
  <link rel="icon" href="data:,">
  <!-- PERF §10.1 / X18: the one game font (Fredoka, the Latin woff2 subset ui/fonts.js registers) starts downloading with the HTML (Vite adds the module preloads) -->
  <link rel="preload" as="font" type="font/woff2" href="assets/fonts/Fredoka-Latin.woff2" crossorigin>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #F6E7D2; overscroll-behavior: none;
                 -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    /* touch layer sits under the UI; the ui agent's touch.js shows it (class "on") on coarse pointers */
    #touch { position: fixed; inset: 0; z-index: 5; display: none; touch-action: none; }
    #touch.on { display: block; }
    /* UI overlay: pointer-events none by default; interactive children opt in */
    #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none;
          padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    #boot-error { position: fixed; left: 16px; bottom: 16px; z-index: 50; padding: 10px 14px; border-radius: 10px;
                  background: #FFF1DE; color: #3A2A1F; font: 600 14px system-ui, sans-serif; }
    /* PERF §10.1 warm splash: the first paint is cream / peach with a paw, a tiny sword and the pink bow (never grey).
       core adds .out when the title (or a ?level) is up and removes the node after the fade. */
    #splash { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; transition: opacity .4s;
              background: radial-gradient(120% 90% at 50% 35%, #FFF4E2 0%, #F7D9B8 55%, #EDB98C 100%); }
    #splash svg { width: min(42vw, 280px); animation: bob 1.6s ease-in-out infinite; }
    @keyframes bob { 50% { transform: translateY(-6px) rotate(-2deg); } }
    @media (prefers-reduced-motion: reduce) { #splash svg { animation: none; } }
    #splash.out { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="splash" aria-label="Swordcat is loading" role="img">
    <svg viewBox="0 0 120 120" aria-hidden="true">
      <g stroke="#4A2A1F" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
        <path d="M84 14l8 8-38 50-10 2 2-10z" fill="#F4F1EC"/>
        <path d="M43 66l11 11M38 71l11 11" fill="none"/>
        <path d="M36 70l14 14" stroke="#F2C14E" stroke-width="7"/>
        <path d="M33 88l6-6" stroke="#8A5A36" stroke-width="6"/>
        <ellipse cx="66" cy="84" rx="21" ry="17" fill="#F4A462"/>
        <ellipse cx="45" cy="60" rx="7.5" ry="9.5" fill="#F4A462"/>
        <ellipse cx="59" cy="50" rx="7.5" ry="9.5" fill="#F4A462"/>
        <ellipse cx="75" cy="51" rx="7.5" ry="9.5" fill="#F4A462"/>
        <ellipse cx="88" cy="62" rx="7.5" ry="9.5" fill="#F4A462"/>
        <path d="M27 28c-9-8-17-2-12 7 4 6 11 4 15 0zM35 28c9-8 17-2 12 7-4 6-11 4-15 0z" fill="#FF8FB1"/>
        <circle cx="31" cy="29" r="4.5" fill="#FF6F9C"/>
      </g>
      <g fill="#FFB3C7">
        <ellipse cx="66" cy="87" rx="12" ry="9"/>
        <ellipse cx="45" cy="61" rx="3.5" ry="4.5"/><ellipse cx="59" cy="51" rx="3.5" ry="4.5"/>
        <ellipse cx="75" cy="52" rx="3.5" ry="4.5"/><ellipse cx="88" cy="63" rx="3.5" ry="4.5"/>
      </g>
    </svg>
  </div>
  <div id="app"></div>
  <div id="touch"></div>
  <div id="ui"></div>
  <noscript>Swordcat needs JavaScript and WebGL2.</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
